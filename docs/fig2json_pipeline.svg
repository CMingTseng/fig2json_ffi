<svg viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif" font-size="13" style="background:#f8f9fa">
  <title>fig2json 轉換流程與關聯性</title>

  <!-- Background -->
  <rect width="720" height="580" fill="#f8f9fa" rx="12"/>

  <!-- ===== Section: 輸入 ===== -->
  <text x="36" y="36" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.08em">INPUT</text>

  <!-- Figma App -->
  <rect x="36" y="48" width="150" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="111" y="72" text-anchor="middle" font-weight="700" fill="#4f46e5">Figma App</text>
  <text x="111" y="90" text-anchor="middle" font-size="11" fill="#6b7280">設計工具（雲端）</text>

  <!-- REST API -->
  <rect x="220" y="48" width="180" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="310" y="68" text-anchor="middle" font-weight="700" fill="#16a34a">Figma REST API</text>
  <text x="310" y="84" text-anchor="middle" font-size="11" fill="#6b7280">官方 JSON 格式</text>
  <text x="310" y="100" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="600">WawelEml...from_figma.json</text>

  <!-- .fig file -->
  <rect x="436" y="48" width="150" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="511" y="72" text-anchor="middle" font-weight="700" fill="#ea580c">canvas.fig</text>
  <text x="511" y="90" text-anchor="middle" font-size="11" fill="#6b7280">Kiwi 二進位格式</text>

  <!-- Arrow: Figma → REST API -->
  <line x1="186" y1="78" x2="220" y2="78" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="203" y="73" text-anchor="middle" font-size="10" fill="#6b7280">Export</text>

  <!-- Arrow: Figma → .fig -->
  <line x1="186" y1="84" x2="360" y2="114" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="114" x2="436" y2="88" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="310" y="128" text-anchor="middle" font-size="10" fill="#6b7280">儲存 / 下載</text>

  <!-- ===== Section: 轉換流程 ===== -->
  <text x="36" y="160" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.08em">fig2json (Rust) 轉換流程</text>

  <!-- Step 1: decode -->
  <rect x="36" y="174" width="140" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="106" y="195" text-anchor="middle" font-weight="600" fill="#111827">1. 解碼 Kiwi</text>
  <text x="106" y="212" text-anchor="middle" font-size="11" fill="#6b7280">schema + data chunk</text>

  <!-- Step 2: build_tree -->
  <rect x="204" y="174" width="140" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="274" y="195" text-anchor="middle" font-weight="600" fill="#111827">2. 建立樹狀結構</text>
  <text x="274" y="212" text-anchor="middle" font-size="11" fill="#6b7280">tree.rs · instance 展開</text>

  <!-- Step 3: transform -->
  <rect x="372" y="174" width="140" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="442" y="195" text-anchor="middle" font-weight="600" fill="#111827">3. 欄位轉換</text>
  <text x="442" y="212" text-anchor="middle" font-size="11" fill="#6b7280">field_alignment.rs 等</text>

  <!-- Step 4: output -->
  <rect x="540" y="174" width="144" height="50" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="612" y="195" text-anchor="middle" font-weight="600" fill="#ea580c">4. 輸出 JSON</text>
  <text x="612" y="212" text-anchor="middle" font-size="11" fill="#6b7280">canvas_output.json</text>

  <!-- Arrows between steps -->
  <line x1="176" y1="199" x2="204" y2="199" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="344" y1="199" x2="372" y2="199" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="512" y1="199" x2="540" y2="199" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- .fig → Step1 -->
  <line x1="511" y1="108" x2="360" y2="174" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <text x="420" y="150" text-anchor="middle" font-size="10" fill="#ea580c">fig2json CLI</text>

  <!-- ===== Section: 比較 ===== -->
  <text x="36" y="270" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.08em">覆蓋率測試</text>

  <!-- compare_conversion.py -->
  <rect x="200" y="284" width="324" height="70" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="362" y="306" text-anchor="middle" font-weight="700" fill="#0284c7">compare_conversion.py</text>
  <text x="362" y="324" text-anchor="middle" font-size="11" fill="#6b7280">取出全部 node → 隨機抽 20 個</text>
  <text x="362" y="340" text-anchor="middle" font-size="11" fill="#6b7280">比對每個 node 有哪些 key</text>

  <!-- Arrows into compare -->
  <line x1="310" y1="108" x2="310" y2="284" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="286" y="256" font-size="10" fill="#16a34a">官方 JSON</text>

  <line x1="612" y1="224" x2="612" y2="258" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="612" y1="258" x2="480" y2="284" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="560" y="256" font-size="10" fill="#ea580c">轉換輸出</text>

  <!-- ===== Section: 結果 ===== -->
  <rect x="200" y="390" width="324" height="80" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="362" y="412" text-anchor="middle" font-weight="700" fill="#111827">覆蓋率結果</text>
  <rect x="220" y="422" width="200" height="14" rx="3" fill="#e5e7eb"/>
  <rect x="220" y="422" width="177" height="14" rx="3" fill="#16a34a" opacity="0.7"/>
  <text x="404" y="433" font-size="11" fill="#16a34a" font-weight="600">88.6%</text>
  <text x="220" y="453" font-size="11" fill="#6b7280">15/20 節點完全覆蓋，2 個節點找不到</text>
  <text x="220" y="466" font-size="11" fill="#6b7280">目標：20/20 = 100% → 完全轉換成功</text>

  <line x1="362" y1="354" x2="362" y2="390" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== 說明框 ===== -->
  <rect x="36" y="390" width="148" height="80" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="110" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">node 是什麼？</text>
  <text x="110" y="426" text-anchor="middle" font-size="11" fill="#6b7280">Figma 裡每個元素</text>
  <text x="110" y="440" text-anchor="middle" font-size="11" fill="#6b7280">FRAME / TEXT / VECTOR</text>
  <text x="110" y="454" text-anchor="middle" font-size="11" fill="#6b7280">INSTANCE 等都是 node</text>
  <text x="110" y="468" text-anchor="middle" font-size="11" fill="#6b7280">共 ~58,000 個</text>

  <rect x="544" y="390" width="148" height="80" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="618" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">source code 的角色</text>
  <text x="618" y="426" text-anchor="middle" font-size="11" fill="#6b7280">fig2json Rust 程式</text>
  <text x="618" y="440" text-anchor="middle" font-size="11" fill="#6b7280">決定哪些欄位會出現</text>
  <text x="618" y="454" text-anchor="middle" font-size="11" fill="#6b7280">在 canvas_output.json</text>
  <text x="618" y="468" text-anchor="middle" font-size="11" fill="#6b7280">裡，補齊 → 覆蓋率上升</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ea580c"/>
    </marker>
  </defs>
</svg>
